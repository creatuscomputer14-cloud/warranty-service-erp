<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warranty Verification</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="login"><main class="login-card" style="width:min(560px,94vw)"><div style="display:flex;justify-content:space-between;align-items:center"><div class="brandmark">W</div><button id="lang" class="smallbtn">EN</button></div><h1 id="title">ওয়ারেন্টি যাচাই</h1><p id="desc">পণ্যের সিরিয়াল নম্বর দিয়ে ওয়ারেন্টির মেয়াদ ও অবস্থা যাচাই করুন।</p><label id="serialLabel">পণ্যের সিরিয়াল নম্বর<input id="serial" placeholder="Serial Number"></label><button id="verify" style="width:100%;margin-top:16px" class="btn">যাচাই করুন</button><div id="result"></div><p style="margin-top:20px"><a href="/" id="adminLink">Admin Login</a></p></main></div>
<script>
let lang='bn';const $=s=>document.querySelector(s);const words={title:['ওয়ারেন্টি যাচাই','Warranty Verification'],desc:['পণ্যের সিরিয়াল নম্বর দিয়ে ওয়ারেন্টির মেয়াদ ও অবস্থা যাচাই করুন।','Check warranty coverage and expiry using the product serial number.'],label:['পণ্যের সিরিয়াল নম্বর','Product Serial Number'],verify:['যাচাই করুন','Verify'],purchase:['ক্রয়ের তারিখ','Purchase Date'],start:['ওয়ারেন্টি শুরু','Warranty Start'],end:['ওয়ারেন্টি শেষ','Warranty Expiry'],status:['ওয়ারেন্টির অবস্থা','Warranty Status'],model:['মডেল','Model'],serial:['সিরিয়াল নম্বর','Serial Number'],active:['সক্রিয়','Active'],expired:['মেয়াদ শেষ','Expired'],notfound:['কোনো ওয়ারেন্টি তথ্য পাওয়া যায়নি','No warranty record found.']};
function renderLang(){const i=lang==='bn'?0:1;$('#title').textContent=words.title[i];$('#desc').textContent=words.desc[i];$('#serialLabel').childNodes[0].textContent=words.label[i];$('#verify').textContent=words.verify[i];$('#lang').textContent=i?'বাংলা':'EN';$('#adminLink').textContent=i?'Admin Login':'অ্যাডমিন লগইন'}
$('#lang').onclick=()=>{lang=lang==='bn'?'en':'bn';renderLang()};
$('#verify').onclick=async()=>{const serial=$('#serial').value.trim();if(!serial)return;$('#result').textContent='...';try{const r=await fetch('/api/warranty/'+encodeURIComponent(serial));const d=await r.json();if(!r.ok)throw Error(d.error);const i=lang==='bn'?0:1;$('#result').innerHTML=`<div class="lookupresult"><h3>${String(d.product||'').replace(/[&<>]/g,'')}</h3><p>${words.model[i]}: ${String(d.model||'—').replace(/[&<>]/g,'')}</p><p>${words.serial[i]}: ${String(d.serial||'').replace(/[&<>]/g,'')}</p><p>${words.purchase[i]}: ${d.purchase_date||'—'}</p><p>${words.start[i]}: ${d.warranty_start||'—'}</p><p>${words.end[i]}: ${d.warranty_end||'—'}</p><b class="tag ${d.warranty_status==='Active'?'green':'red'}">${words.status[i]}: ${d.warranty_status==='Active'?words.active[i]:words.expired[i]}</b></div>`}catch(e){$('#result').innerHTML='<p class="error">'+words.notfound[lang==='bn'?0:1]+'</p>'}};
renderLang();
</script></body></html>
